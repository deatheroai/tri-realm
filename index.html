<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>tri-realm</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2310151c%22/><circle cx=%2250%22 cy=%2250%22 r=%2230%22 fill=%22%23d9822b%22/></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10151c;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud-position,
      #hud-controls,
      #hud-structures {
        position: fixed;
        color: #8f9bab;
        font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        opacity: 0.7;
        pointer-events: none;
        user-select: none;
        z-index: 10;
      }
      #hud-position {
        bottom: 10px;
        left: 12px;
      }
      #hud-structures {
        bottom: 10px;
        right: 12px;
      }
      #hud-controls {
        top: 10px;
        left: 12px;
        right: 12px;
      }
      /*
       * Left-side touch zone the floating joystick appears inside of.
       * pointer-events stays off by default so a mouse click there falls
       * through to the canvas (for castle placement) instead of being
       * swallowed by this overlay — only a touch-primary device (where the
       * joystick is actually needed) turns it interactive.
       */
      #touch-zone {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 55%;
        height: 60%;
        touch-action: none;
        z-index: 5;
        pointer-events: none;
      }
      @media (pointer: coarse) {
        #touch-zone {
          pointer-events: auto;
        }
      }
      #joystick-base {
        position: fixed;
        display: none;
        width: 100px;
        height: 100px;
        margin-left: -50px;
        margin-top: -50px;
        border-radius: 50%;
        background: rgba(217, 130, 43, 0.12);
        border: 2px solid rgba(217, 130, 43, 0.4);
        z-index: 6;
        pointer-events: none;
      }
      #joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin-left: -22px;
        margin-top: -22px;
        border-radius: 50%;
        background: rgba(217, 130, 43, 0.85);
      }
      /*
       * Dev-only panels (skin/material switcher, castle structure-type
       * switcher — not child-facing UI, see DECISIONS.md). Both stack in
       * one shared column instead of opposite corners: two independently
       * grown panels anchored to opposite sides collided in the middle on
       * narrow viewports (see BACKLOG.md's Skins section). #dev-panels is
       * genuinely shared between the World and Skins tracks — new dev
       * panels join this same column rather than claiming a new corner.
       */
      #dev-panels {
        position: fixed;
        top: 64px;
        right: 12px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        max-width: min(70vw, 320px);
      }
      #dev-skin-panel,
      #dev-structure-panel {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        color: #8f9bab;
        background: rgba(16, 21, 28, 0.6);
        border: 1px solid rgba(143, 155, 171, 0.3);
        border-radius: 6px;
        padding: 6px 8px;
        max-width: 100%;
      }
      #dev-skin-panel > div,
      #dev-structure-panel > div {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
      }
      #dev-skin-panel button,
      #dev-structure-panel button {
        font: inherit;
        color: #d9822b;
        background: rgba(217, 130, 43, 0.12);
        border: 1px solid rgba(217, 130, 43, 0.4);
        border-radius: 4px;
        padding: 2px 6px;
        cursor: pointer;
      }
      #dev-skin-panel button:hover,
      #dev-structure-panel button:hover {
        background: rgba(217, 130, 43, 0.25);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="touch-zone"></div>
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div id="hud-controls">
      Move: WASD / Arrows or touch-drag (left side) &middot; Run: Shift or drag further out
      &middot; Click / tap elsewhere to place a castle piece
    </div>
    <div id="hud-position" data-x="0" data-z="0">x: 0.00  z: 0.00</div>
    <div id="hud-structures" data-count="0">Structures: 0</div>
    <div id="dev-panels">
      <div id="dev-skin-panel">🔧 skins</div>
      <div id="dev-structure-panel">🏰 structures</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
