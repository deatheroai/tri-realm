<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tri-realm</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2310151c%22/><circle cx=%2250%22 cy=%2250%22 r=%2230%22 fill=%22%23d9822b%22/></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10151c;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud-position,
      #hud-controls {
        position: fixed;
        color: #8f9bab;
        font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        opacity: 0.7;
        pointer-events: none;
        user-select: none;
      }
      #hud-position {
        bottom: 10px;
        left: 12px;
      }
      #hud-controls {
        top: 10px;
        left: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud-controls">WASD / Arrow keys to walk &middot; Shift to run</div>
    <div id="hud-position" data-x="0" data-z="0">x: 0.00  z: 0.00</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
